server.port=8081

# Spring Application Name
spring.application.name=secureqr-health

# Firebase Configuration
firebase.project-id=${FIREBASE_PROJECT_ID:carekey-468e8}
firebase.client-email=${FIREBASE_CLIENT_EMAIL:}
firebase.private-key=${FIREBASE_PRIVATE_KEY:}

# OpenRouter AI Configuration
openrouter.api-key=${OPENROUTER_API_KEY:}
openrouter.model=${OPENROUTER_MODEL:meta-llama/llama-3.3-70b-instruct:free}
openrouter.api-url=${OPENROUTER_API_URL:https://openrouter.ai/api/v1/chat/completions}

# Legacy Gemini AI Fallback Configuration
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-1.5-flash}

# Public-Health Aggregation Privacy Threshold (PRD §14)
privacy.aggregation.threshold-k=10

# Logging
logging.level.com.carekey=DEBUG
logging.level.org.springframework.security=INFO

